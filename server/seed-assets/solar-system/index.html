<main class="wrap">
  <h1 id="title"></h1>
  <canvas id="sky" width="720" height="440" role="img" aria-label=""></canvas>
  <div class="controls">
    <label for="speed"><span id="speedLabel"></span></label>
    <input id="speed" type="range" min="0" max="4" step="0.5" value="1">
  </div>
  <div id="list" class="list" role="group"></div>
  <section class="card" aria-live="polite"><h2 id="pname"></h2><p id="pinfo"></p></section>
  <p class="note" id="note"></p>
</main>
