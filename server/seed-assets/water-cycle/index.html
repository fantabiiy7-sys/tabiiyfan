<main class="wrap">
  <h1 id="title"></h1>
  <canvas id="scene" width="720" height="360" role="img" aria-label=""></canvas>
  <div class="controls">
    <label for="heat"><span id="heatLabel"></span>: <output id="heatOut">2</output></label>
    <input id="heat" type="range" min="1" max="3" step="1" value="2">
    <button id="pause" type="button"></button>
  </div>
  <div class="stages" id="stages" role="group"></div>
  <p id="info" class="info" aria-live="polite"></p>
  <p class="note" id="note"></p>
</main>
